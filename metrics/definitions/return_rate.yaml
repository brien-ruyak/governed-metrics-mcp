name: return_rate.yaml
description: >-
  Returns as a percentage of completed orders, optionally filtered by
  product category, region, or time window. Returns both the rate and
  the underlying counts. Use this metric to answer questions like
  "What's our return rate for electronics?" or "Which region has the
  highest return rate this quarter?"

parameters:
  - name: start_date
    type: date
    description: Start of the time window (YYYY-MM-DD). Defaults to 90 days ago.
    required: false

  - name: end_date
    type: date
    description: End of the time window (YYYY-MM-DD). Defaults to today.
    required: false

  - name: region
    type: str
    description: "Filter by order region. Valid values: West, East, Central, South."
    required: false
    enum: [West, East, Central, South]

  - name: category
    type: str
    description: >-
      Filter by product category. When set, only orders containing items in
      this category are included in the denominator. Returns are counted
      regardless of product category. Valid values: apparel, electronics,
      home, beauty, sports.
    required: false
    enum: [apparel, electronics, home, beauty, sports]

sql_base: >-
  WITH eligible_orders AS (
    SELECT DISTINCT o.order_id
    FROM orders o
    WHERE o.order_date >= $start_date
      AND o.order_date <= $end_date
      AND o.status = 'completed'

sql_filters:
  region: "AND o.region = $region"
  category: >-
    AND o.order_id IN (
      SELECT oi.order_id FROM order_items oi
      JOIN products p ON oi.product_id = p.product_id
      WHERE p.category = $category
    )

sql_suffix: >-
  )
  SELECT
    ROUND(
      COUNT(DISTINCT r.order_id) * 100.0
        / NULLIF((SELECT COUNT(*) FROM eligible_orders), 0),
      2
    ) AS return_rate,
    COUNT(DISTINCT r.order_id) AS returned_orders,
    (SELECT COUNT(*) FROM eligible_orders) AS total_orders
  FROM eligible_orders eo
  LEFT JOIN returns r ON eo.order_id = r.order_id

output_columns:
  - return_rate
  - returned_orders
  - total_orders